<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0369a1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- seo:start — the home page's tags; the build writes each page's own (scripts/seo-pages.mjs) -->
    <title>Studio Tools — Free Online Image, OCR & PDF Tools</title>
    <meta name="description" content="Remove backgrounds, upscale photos with AI, extract English and Nepali text with OCR, and edit, sign, merge and convert PDFs. Free, private, no install." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- seo:end -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Noto+Sans+Devanagari:wght@400..700&family=Noto+Serif+Devanagari:wght@400..700&family=Noto+Serif:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      try {
        const locale = localStorage.getItem("locale") || (navigator.language.toLowerCase().startsWith("ne") ? "ne" : "en");
        document.documentElement.lang = locale === "ne" ? "ne" : "en";
        const theme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || (!theme && prefersDark)) document.documentElement.classList.add("dark-mode");
      } catch {}
    </script>
  </head>
  <body class="bg-primary text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
